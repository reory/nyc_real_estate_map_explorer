[pytest]
# Minimum pytest version
minversion = 6.0

# Directory where tests are located
testpaths = tests

# Patterns to match test files
python_files = test_*.py *_test.py

# Default command line options
# -v: verbose output
# --tb=short: cleaner tracebacks
# --cov=src: calculate coverage for your source code (requires pytest-cov)
addopts = -v --tb=short --cov=src

# Custom markers to categorize tests
markers =
    unit: standard unit tests
    integration: tests that involve database or file operations
    slow: tests that take a long time to run

# Ignore specific warnings that clutter output
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:streamlit.*
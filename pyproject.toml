[project]
name = "nyc-real-estate-map-explorer"
version = "0.1.0"
description = "The NYC Real Estate Explorer is a high-performance web dashboard engineered to transform raw real estate datasets into actionable visual insights."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "folium==0.20.0",
    "pandas==3.0.3",
    "plotly==6.8.0",
    "scipy==1.17.1",
    "sqlalchemy==2.0.50",
    "sqlalchemy-orm==1.2.10",
    "streamlit==1.58.0",
    "streamlit-folium==0.27.2",
]

[dependency-groups]
test = [
    "hypothesis==6.155.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = [
    "test_*.py",
    "*_test.py",
]
addopts = "-v --tb=short --cov=src"

markers = [
    "unit: standard unit tests",
    "integration: tests that involve database or file operations",
    "slow: tests that take a long time to run",
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:streamlit.*",
    "ignore:overflow encountered in square:RuntimeWarning",
    "ignore:overflow encountered in multiply:RuntimeWarning",
    "ignore:invalid value encountered in subtract:RuntimeWarning",
]
